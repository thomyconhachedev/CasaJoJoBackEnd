spring.application.name=CasaJoJoBackEnd

spring.datasource.url=jdbc:mysql://localhost:3306/casajojo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

menu.sheet.csv-url=https://docs.google.com/spreadsheets/d/e/2PACX-1vT3wdIy7ap7gej8uVrufzVC_EmniLPJqrEv2zRYd9pS8e9E8m1C7vZrP367uXXCR4hOWo5EjcI9eyF3/pub?output=csv

# Zona horaria del negocio: define la hora actual para validar la hora de retiro y el cambio de dia del menu
app.zona-horaria=America/Santiago

# Stock inicial de cada item cuando el Sheet no trae una columna "Stock"
menu.stock-por-defecto=50

# --- Seguridad: JWT y cuenta admin (todo aqui, sin .env) ---
# Clave para firmar los tokens (minimo 32 caracteres). CAMBIAR en produccion.
# En la EC2 se puede sobreescribir sin tocar el archivo: docker run -e APP_JWT_SECRET=...
app.jwt.secret=casajojo-clave-de-desarrollo-cambiar-en-produccion-2026
app.jwt.expiracion-dias=7

# Cuenta admin que se crea al arrancar si no existe (docker run -e APP_ADMIN_PASSWORD=...)
app.admin.username=admin
app.admin.password=casajojo2026
